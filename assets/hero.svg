<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Light Loop — one agent, better every turn</title>
  <desc id="desc">A plain technical diagram: work produces a result, the agent improves its approach, and the next turn returns to work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#2563eb" stroke-width="1.7"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171717">
    <text x="64" y="100" font-size="22" fill="#64748b">CODEX / GOAL-BASED LOOPS</text>
    <text x="60" y="232" font-size="88" font-weight="700" letter-spacing="-3">LIGHT LOOP</text>
    <text x="64" y="304" font-size="32">One agent.</text>
    <text x="64" y="352" font-size="32">Better every turn.</text>
    <g fill="#fff" stroke="#171717" stroke-width="2">
      <rect x="936" y="80" width="400" height="96"/>
      <rect x="936" y="296" width="400" height="96"/>
    </g>
    <g text-anchor="middle" font-size="30" font-weight="700">
      <text x="1136" y="139">WORK</text>
      <text x="1136" y="355">IMPROVE APPROACH</text>
    </g>
    <g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)">
      <path d="M1136 188V282"/>
      <path d="M1348 344H1490V128H1348"/>
    </g>
    <text x="1160" y="245" font-size="20" fill="#64748b">RESULT</text>
    <text x="1354" y="245" font-size="20" fill="#64748b">NEXT TURN</text>
  </g>
</svg>
